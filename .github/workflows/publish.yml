name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run smoke:bin
      - name: Publish package and wait for npm visibility
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$package_version" >&2
            exit 1
          fi

          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already visible on npm; skipping npm publish"
          else
            echo "$package_spec is not visible on npm; attempting npm publish"
            npm publish || echo "npm publish failed; checking whether the version became visible"
          fi

          for attempt in {0..20}; do
            if npm view "$package_spec" version >/dev/null 2>&1; then
              echo "$package_spec is visible on npm"
              exit 0
            fi
            if [[ "$attempt" -lt 20 ]]; then
              echo "Waiting for $package_spec to become visible ($((attempt + 1))/20)"
              sleep 15
            fi
          done

          echo "Timed out waiting for $package_spec to become visible on npm" >&2
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install verified mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
